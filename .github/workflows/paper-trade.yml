name: paper-trade
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-trade
  cancel-in-progress: false
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - run: python bot.py once
      - name: Save state and trade log
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add state.json trades.csv equity.csv data.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "paper trade update" && git push)
